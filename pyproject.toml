[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch]
build.targets.wheel.packages = ["src/camelot_key"]
version.path = "src/camelot_key/__init__.py"

[project]
name = "camelot_key"
dynamic = ["version"]
authors = [
  { name="BasementCat" },
]
description = "Parse and format musical key notation and convert between Camelot key notation"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["camelot wheel", "camelot key", "musical key", "music key", "music", "circle of fifths", "dj"]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/BasementCat/python-camelot-key"
